name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build & check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux ─────────────────────────────────────────────────────────
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: screenstream-linux-x86_64

          # ── macOS (Apple Silicon) ──────────────────────────────────────────
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: screenstream-macos-arm64

          # ── macOS (Intel) ─────────────────────────────────────────────────
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: screenstream-macos-x86_64

          # ── Windows ───────────────────────────────────────────────────────
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            artifact: screenstream-windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # ── Linux system dependencies ─────────────────────────────────────────
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev libavdevice-dev \
            libsrt-openssl-dev \
            libxkbcommon-dev libwayland-dev \
            libx11-dev libxrandr-dev libxcb1-dev \
            libfontconfig1-dev libfreetype6-dev \
            libasound2-dev libpulse-dev \
            clang cmake pkg-config

      # ── macOS system dependencies ─────────────────────────────────────────
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg srt pkg-config

      # ── Windows system dependencies ───────────────────────────────────────
      - name: Install Windows dependencies (vcpkg)
        if: runner.os == 'Windows'
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 'a42af01b72c28a8e1d7b48107b33e4f286a55ef6'
      - name: vcpkg install packages (Windows)
        if: runner.os == 'Windows'
        run: |
          vcpkg install ffmpeg:x64-windows srt:x64-windows
          echo "PKG_CONFIG_PATH=$env:VCPKG_ROOT/installed/x64-windows/lib/pkgconfig" >> $env:GITHUB_ENV

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}

      # ── Rename binary for upload ──────────────────────────────────────────
      - name: Rename Linux/macOS binary
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/screenstream \
             ${{ matrix.artifact }}

      - name: Rename Windows binary
        if: runner.os == 'Windows'
        run: |
          Copy-Item "target/${{ matrix.target }}/release/screenstream.exe" `
                    "${{ matrix.artifact }}.exe"

      # ── Upload build artifact ─────────────────────────────────────────────
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.exe
          if-no-files-found: ignore
          retention-days: 14

  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Clippy + fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev \
            libsrt-openssl-dev \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libfontconfig1-dev libfreetype6-dev \
            libasound2-dev libpulse-dev \
            clang cmake pkg-config

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --check
