name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build & check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux ─────────────────────────────────────────────────────────
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: screenstream-linux-x86_64

          # ── macOS (Apple Silicon) ──────────────────────────────────────────
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: screenstream-macos-arm64

          # ── Windows ───────────────────────────────────────────────────────
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            artifact: screenstream-windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # ── Linux system dependencies ─────────────────────────────────────────
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev libavdevice-dev \
            libsrt-openssl-dev \
            libxkbcommon-dev libwayland-dev \
            libx11-dev libxrandr-dev libxcb1-dev \
            libfontconfig1-dev libfreetype6-dev \
            libasound2-dev libpulse-dev \
            libpipewire-0.3-dev libspa-0.2-dev \
            libdbus-1-dev \
            clang cmake pkg-config

      # ── macOS system dependencies ─────────────────────────────────────────
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg srt pkg-config

      # ── Windows system dependencies ───────────────────────────────────────
      # Use a pre-built FFmpeg from BtbN — includes SRT support, MSVC-compatible
      # .lib files, and all DLLs. Avoids vcpkg whose `srt` port was removed.
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Write-Host "Downloading pre-built FFmpeg (BtbN GPL shared)..."
          Invoke-WebRequest `
            -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip" `
            -OutFile "$env:TEMP\ffmpeg.zip" -UseBasicParsing
          Expand-Archive "$env:TEMP\ffmpeg.zip" -DestinationPath "$env:TEMP\ffmpeg-src" -Force
          $src = (Get-ChildItem "$env:TEMP\ffmpeg-src" -Directory | Select-Object -First 1).FullName
          Move-Item $src "C:\ffmpeg" -Force

          "FFMPEG_DIR=C:\ffmpeg"         >> $env:GITHUB_ENV
          "PATH=C:\ffmpeg\bin;$env:PATH" >> $env:GITHUB_ENV

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}

      # ── Rename binary for upload ──────────────────────────────────────────
      - name: Rename Linux/macOS binary
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/screenstream \
             ${{ matrix.artifact }}

      - name: Rename Windows binary
        if: runner.os == 'Windows'
        run: |
          Copy-Item "target/${{ matrix.target }}/release/screenstream.exe" `
                    "${{ matrix.artifact }}.exe"

      # ── Upload build artifact ─────────────────────────────────────────────
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.exe
          if-no-files-found: ignore
          retention-days: 14
